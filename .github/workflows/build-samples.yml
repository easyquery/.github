# Reusable build for the eq-samples-* repositories.
# Called from each repository's .github/workflows/build.yml with the solution to build.
#
# Windows, because the .NET Framework, WinForms and WPF samples need it, and MSBuild
# (not `dotnet build`), because only MSBuild builds the old-style .NET Framework projects.
# Both SDK-style and old-style projects restore with `-restore`.
#
# The .esproj client projects (Vue 3, Angular ad-hoc reporting) set ShouldRunBuildScript to
# false, so the solution build only runs `npm install` for them. A separate step then runs
# `npm run build` in each of them, so the client code is compiled too.

name: Build samples

on:
  workflow_call:
    inputs:
      solution:
        description: Solution file at the repository root
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild "${{ inputs.solution }}" -restore -p:Configuration=Release -m -nologo -v:minimal

      - name: Build the .esproj client apps
        shell: pwsh
        run: |
          $clients = Get-ChildItem -Recurse -Filter *.esproj |
              Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' }
          if (-not $clients) { Write-Host 'No .esproj client apps.'; exit 0 }
          foreach ($c in $clients) {
              Write-Host "::group::npm run build in $($c.DirectoryName)"
              Push-Location $c.DirectoryName
              if (-not (Test-Path node_modules)) {
                  npm install --no-audit --no-fund
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
              }
              npm run build
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              Pop-Location
              Write-Host '::endgroup::'
          }
