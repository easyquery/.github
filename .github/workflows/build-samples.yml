# Reusable build for the eq-samples-* repositories.
# Called from each repository's .github/workflows/build.yml with the solution to build.
#
# Windows, because the .NET Framework, WinForms and WPF samples need it, and MSBuild
# (not `dotnet build`), because only MSBuild builds the old-style .NET Framework projects.
# Both SDK-style and old-style projects restore with `-restore`.
#
# The solution build doesn't compile every client app:
# - .esproj clients (Vue 3, Angular ad-hoc reporting) set ShouldRunBuildScript to false, so it
#   only runs `npm install` for them;
# - SpaRoot ClientApp folders (Vue 2, React, Stencil, Angular advanced search) only get
#   `npm run build` on `dotnet publish`, not on a build.
# The last step therefore runs `npm install` (where needed) and `npm run build` in each of
# them. Clients that their project builds itself (RazorTypeScript's PreBuild) are not listed.

name: Build samples

on:
  workflow_call:
    inputs:
      solution:
        description: Solution file at the repository root
        required: true
        type: string
      repository:
        description: >-
          Repository to build (owner/name). Empty means the calling repository. Set only by
          test-build-samples.yml, which builds the samples repositories from here.
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository != '' && inputs.repository || github.repository }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: microsoft/setup-msbuild@v2

      - name: Install missing .NET Framework reference assemblies
        shell: pwsh
        run: |
          # Old-style projects need the reference assemblies of their TargetFrameworkVersion,
          # and the runner image doesn't carry every version (4.6.1 is gone since VS 18). Each
          # missing one comes from Microsoft's NuGet package of the same assemblies.
          $skip = '[\\/]node_modules[\\/]'
          $root = Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies\Microsoft\Framework\.NETFramework'
          $versions = Get-ChildItem -Recurse -Include *.csproj, *.vbproj |
              Where-Object { $_.FullName -notmatch $skip } |
              Select-String -Pattern '<TargetFrameworkVersion>v([0-9.]+)</TargetFrameworkVersion>' |
              ForEach-Object { $_.Matches[0].Groups[1].Value } | Sort-Object -Unique
          if (-not $versions) { Write-Host 'No .NET Framework projects.'; exit 0 }
          foreach ($v in $versions) {
              if (Test-Path (Join-Path $root "v$v\mscorlib.dll")) { Write-Host "v${v}: on the runner"; continue }
              $id = "microsoft.netframework.referenceassemblies.net$($v -replace '\.', '')"
              $nupkg = Join-Path $env:RUNNER_TEMP "$id.zip"
              Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/$id/1.0.3/$id.1.0.3.nupkg" -OutFile $nupkg
              $dir = Join-Path $env:RUNNER_TEMP $id
              Expand-Archive $nupkg $dir -Force
              Copy-Item (Join-Path $dir "build\.NETFramework\v$v") $root -Recurse -Force
              Write-Host "v${v}: installed from NuGet $id 1.0.3"
          }

      - name: Build
        run: msbuild "${{ inputs.solution }}" -restore -p:Configuration=Release -m -nologo -v:minimal

      - name: Build the client apps
        shell: pwsh
        env:
          # GitHub sets CI=true, and create-react-app then fails the build on lint warnings.
          CI: 'false'
          NG_CLI_ANALYTICS: 'false'
        run: |
          # .esproj folders, plus each project's SpaRoot resolved against its folder; a SpaRoot
          # that points at an .esproj folder (Vue 3's server) is listed once.
          $skip = '[\\/]node_modules[\\/]'
          $dirs = @()
          $dirs += Get-ChildItem -Recurse -Filter *.esproj |
              Where-Object { $_.FullName -notmatch $skip } | ForEach-Object { $_.DirectoryName }
          foreach ($p in Get-ChildItem -Recurse -Include *.csproj, *.vbproj |
                  Where-Object { $_.FullName -notmatch $skip }) {
              $m = Select-String -Path $p.FullName -Pattern '<SpaRoot>([^<]+)</SpaRoot>' | Select-Object -First 1
              if ($m) {
                  $dir = Join-Path $p.DirectoryName $m.Matches[0].Groups[1].Value
                  if (Test-Path (Join-Path $dir 'package.json')) { $dirs += (Resolve-Path $dir).Path.TrimEnd('\', '/') }
              }
          }
          $dirs = $dirs | Sort-Object -Unique
          if (-not $dirs) { Write-Host 'No client apps to build.'; exit 0 }
          # The Visual Studio vite/Angular templates export an ASP.NET Core dev certificate when
          # their config loads, even for a build, and current SDKs refuse to export into a
          # folder that doesn't exist yet.
          New-Item -ItemType Directory -Force "$env:APPDATA\ASP.NET\https" | Out-Null
          foreach ($d in $dirs) {
              Write-Host "::group::npm run build in $d"
              Push-Location $d
              if (-not (Test-Path node_modules)) {
                  npm install --no-audit --no-fund
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
              }
              npm run build
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              Pop-Location
              Write-Host '::endgroup::'
          }
